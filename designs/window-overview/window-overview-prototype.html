<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaneSet · 窗口总览原型</title>
<style>
:root{--paper:#f4f5f1;--ink:#25332e;--muted:#52665c;--line:#ccd6ce;--green:#27664e;--soft:#e3eddf;--surface:#fff;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);font-size:14px}
*{box-sizing:border-box}body{margin:0;overflow:hidden}.apparea{height:calc(100dvh - 84px);overflow:auto}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:7px;padding:10px 14px;min-height:40px}button:hover{background:var(--soft)}button:disabled{cursor:default;opacity:.48}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #347456;outline-offset:3px}button.primary{background:var(--green);border-color:var(--green);color:white}input,select{border:1px solid var(--line);border-radius:6px;background:white;padding:10px}input{min-width:0}input::placeholder{color:var(--muted)}::selection{background:#c6dfc3;color:#183e2e}::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#a9b9ad;border:2px solid var(--paper);border-radius:6px}
.demo-note{padding:10px 28px;background:#e5ebe4;color:#354c3f;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.demo-note a{color:var(--green)}header{padding:25px 32px 18px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:25px;letter-spacing:-.02em;margin:0 0 4px}p{margin:0;color:var(--muted);line-height:1.65}.brand{flex:1;min-width:240px}.find{width:260px}.shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:28px;padding:0 32px 32px;max-width:1920px;margin:auto}.canvas{min-width:0}.canvas-head{display:flex;justify-content:space-between;gap:16px;margin:8px 0 16px;color:var(--muted)}.canvas-head strong{color:var(--ink)}.windows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.window{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:12px;padding:0;overflow:hidden;background:white;min-width:0;transition:background .15s}.window:hover{background:white;border-color:#789b83}.window[aria-pressed="true"]{outline:3px solid var(--green);outline-offset:1px}.check{position:absolute;top:12px;right:12px;width:27px;height:27px;display:grid;place-items:center;background:#fff;border:1px solid #879f8e;border-radius:7px;font-weight:700;z-index:2;color:var(--green)}.window[aria-pressed="true"] .check{background:var(--green);border-color:var(--green);color:white}.content-preview{height:164px;overflow:hidden;background:#e9edf0;position:relative;pointer-events:none}.window-title{padding:12px 14px 15px;display:flex;flex-direction:column;gap:5px}.window-title strong{font-size:14px;line-height:1.5;overflow-wrap:anywhere}.window-title small{color:var(--muted);font-size:12px}.win-chrome{height:22px;display:flex;gap:12px;align-items:center;background:#f4f6f8;border-bottom:1px solid #d4dce0;padding:0 9px;font-size:8px;color:#485867}.win-chrome b{margin-right:auto}.doc{background:#e5e8eb;height:100%;padding:14px 35px}.page{background:white;padding:15px 17px;height:190px;overflow:hidden;border:1px solid #dfe4e6;font-size:8px;line-height:1.8;color:#34434c}.page h2{font-size:13px;margin:0 0 9px;color:#233b47}.page h3{font-size:9px;margin:9px 0 4px}.page .highlight{background:#fae4bc}.page .revision{color:#a24439;text-decoration:underline}.sheet{background:white;height:100%;padding:10px 12px}.sheet table{width:100%;border-collapse:collapse;font-size:9px;color:#344f42}.sheet th,.sheet td{border:1px solid #d7e0d9;padding:5px;text-align:right}.sheet th{background:#e6efe7}.sheet th:first-child,.sheet td:first-child{text-align:left}.sheet .hot{background:#f7eed5}.browser{height:100%;background:#fff;padding:12px 15px}.browser .url{font-size:8px;background:#eff2f4;border-radius:5px;padding:5px;color:#52666f}.browser h2{font-size:14px;margin:12px 0 6px;color:#31485a}.browser p{font-size:9px;line-height:1.7;color:#52666f}.article-lines{height:30px;border-top:1px solid #dce3e7;border-bottom:1px solid #dce3e7;margin-top:10px}.chat{height:100%;background:#f1f4f7;padding:12px;display:flex;flex-direction:column;gap:9px}.chat div{background:white;padding:8px;border-radius:6px;font-size:9px;color:#354654;max-width:85%}.chat div:last-child{align-self:flex-end;background:#dceadf}.code{background:#29323a;color:#dce5de;height:100%;padding:12px 18px;font:10px/1.7 Consolas,monospace;white-space:pre}.files{background:white;height:100%;padding:18px;font-size:10px;color:#44554a}.files div{padding:9px;border-bottom:1px solid #e2e8e2}.unavailable{height:100%;display:grid;place-content:center;text-align:center;gap:9px;background:#edf0e9;color:#526455;padding:24px}.unavailable strong{font-size:16px}.invalid{border-color:#b56043;background:#fcf3eb}.invalid .content-preview{opacity:.5}.invalid .window-title small{color:#8f452c}.aside{align-self:start;position:sticky;top:20px;background:#e9eee6;padding:20px;border-radius:12px}.aside h2{font-size:17px;margin:0 0 12px}.selected{min-height:70px;display:flex;flex-direction:column;gap:8px;margin:14px 0 23px}.selected-item{display:flex;gap:10px;align-items:center;line-height:1.4}.selected-item b{background:var(--green);color:white;min-width:25px;height:25px;display:grid;place-items:center;border-radius:5px}.selected-item span{flex:1;font-size:12px}.selected-item button{padding:0;min-height:28px;width:28px;background:transparent}.aside label{display:block;margin:10px 0 8px;color:var(--muted)}.aside select{width:100%}.layout-preview{height:116px;background:#d9e2d4;display:flex;gap:5px;padding:7px;margin:13px 0;border-radius:6px}.layout-preview div{background:#b9d0ae;display:grid;place-items:center;color:#214b35;font-size:20px;font-weight:600;flex:1}.layout-preview.grid{display:grid;grid-template-columns:repeat(2,1fr)}.layout-preview.main div:first-child{flex:2}.actions{display:flex;gap:8px;margin:18px 0 9px}.actions .primary{flex:1}.status{font-size:12px;line-height:1.7;min-height:42px}.scenario{margin-top:19px;border-top:1px solid var(--line);padding-top:15px}.scenario summary{cursor:pointer;font-size:12px;color:var(--muted)}.scenario div{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.scenario button{font-size:12px;min-height:32px;padding:6px 9px}.state{margin-top:10px;font-size:12px;color:#526455;overflow-wrap:anywhere}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 10px;background:#243b30;color:white;border-radius:12px;z-index:10;max-width:calc(100% - 24px);box-shadow:0 8px 24px #203c302b}.switcher button{background:transparent;color:white;border-color:#597568;padding:5px 11px;min-height:32px}.switcher select{background:#243b30;color:white;border-color:#597568;max-width:230px;padding:7px;font-size:13px}.empty{padding:60px;text-align:center;color:var(--muted)}.closed{padding:56px;max-width:650px;margin:32px auto;background:white;border:1px solid var(--line);border-radius:12px;text-align:center}.closed h2{margin:0 0 13px;font-size:24px}.closed button{margin-top:20px}.closed p+p{margin-top:8px}.closed[hidden]{display:none}
body[data-variant="B"] .windows{grid-template-columns:1fr;gap:17px}body[data-variant="B"] .window{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(140px,1fr);min-height:225px}body[data-variant="B"] .content-preview{height:225px}body[data-variant="B"] .window-title{justify-content:center;padding:24px}body[data-variant="B"] .doc{padding:14px 58px}body[data-variant="B"] .page{height:240px;font-size:10px}body[data-variant="B"] .page h2{font-size:18px}body[data-variant="B"] .check{left:12px;right:auto}
body[data-variant="C"] .windows{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;background:#e4e9e2;padding:18px;border-radius:12px}body[data-variant="C"] .window{grid-column:span 4}body[data-variant="C"] .window:nth-child(1){grid-column:1 / span 5}body[data-variant="C"] .window:nth-child(2){grid-column:2 / span 5;grid-row:2}body[data-variant="C"] .window:nth-child(3){grid-column:7 / span 6;grid-row:1}body[data-variant="C"] .window:nth-child(4){grid-column:8 / span 5}body[data-variant="C"] .window:nth-child(5){grid-column:1 / span 4}body[data-variant="C"] .window:nth-child(6){grid-column:6 / span 7}body[data-variant="C"] .content-preview{height:184px}
@media(min-width:1400px){.windows{grid-template-columns:repeat(4,minmax(0,1fr))}.content-preview{height:185px}}@media(max-width:1100px){.windows{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:minmax(0,1fr) 246px;gap:20px;padding-left:24px;padding-right:24px}}@media(max-width:760px){header{padding:20px;gap:14px}.brand{min-width:220px}.find{width:100%}.shell{display:flex;flex-direction:column;padding:0 20px 32px;gap:20px}.aside{position:static;order:-1;padding:15px}.selected{min-height:0;margin:8px 0 15px}.layout-preview{height:72px}.actions{margin:10px 0}.scenario{margin-top:10px}.windows{gap:14px}.content-preview{height:135px}.doc{padding:10px 17px}.window-title{padding:10px}.demo-note{padding:9px 20px}.canvas-head{font-size:12px}body[data-variant="C"] .windows{padding:12px;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}body[data-variant="C"] .window:nth-child(n){grid-column:auto;grid-row:auto}body[data-variant="C"] .content-preview{height:135px}body[data-variant="B"] .window{grid-template-columns:1fr}body[data-variant="B"] .window-title{padding:14px}body[data-variant="B"] .doc{padding:18px 35px}.closed{padding:30px;margin:20px}}@media(max-width:420px){.windows{grid-template-columns:1fr}.content-preview{height:180px}.find{width:100%}.switcher select{max-width:180px}.shell{padding-left:14px;padding-right:14px}.closed{padding:25px}.demo-note{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="apparea">
<div class="demo-note"><span>交互原型 · 窗口与内容均为模拟 · 不操作真实桌面</span><span>显示器 1 · 每次新选择 · 切换方案保留选择</span></div>
<header><div class="brand"><h1>选择要一起看的窗口</h1><p>被遮挡的窗口也在这里。点击选择，编号对应排布顺序。</p></div><input class="find" id="find" type="search" aria-label="搜索应用或窗口标题" placeholder="搜索应用或窗口标题"><button id="restart">重新进入 B</button></header>
<main class="shell" id="overview" data-screen-label="本屏窗口总览">
<section class="canvas" aria-label="候选窗口"><div class="canvas-head"><strong id="variant-description"></strong><span id="candidate-count"></span></div><div id="windows" class="windows"></div><p id="empty" class="empty" hidden>没有匹配的窗口，试试应用名或另一段标题。</p></section>
<aside class="aside"><h2 id="selection-count"></h2><p>点击已选卡片可取消选择。</p><div id="selected" class="selected"></div><label for="layout">排布方式</label><select id="layout"><option value="auto">自动布局</option><option value="columns">等宽 · Alt+1</option><option value="main">一主多辅 · Alt+2</option><option value="grid">网格 · Alt+3</option></select><div id="layout-preview" class="layout-preview" aria-label="所选窗口布局预览"></div><p style="font-size:12px">预览只显示所选窗口的最终位置。</p><div class="actions"><button class="primary" id="apply">排布 · Enter</button><button id="cancel">取消</button></div><p id="status" class="status" role="status" aria-live="polite"></p><details class="scenario"><summary>原型场景与模拟状态</summary><div><button id="invalidate">模拟 2 号窗口关闭</button><button id="undo">恢复模拟布局</button></div><p class="state" id="state"></p></details></aside>
</main>
<section class="closed" id="closed" hidden aria-live="polite"><h2 id="closed-title"></h2><p id="closed-message"></p><p id="closed-state"></p><button class="primary" id="reenter">再次进入 B</button></section>
</div>
<nav class="switcher" aria-label="原型方案切换"><button id="previous" aria-label="上一个原型方案">←</button><select id="variant" aria-label="原型方案"><option value="A">方案 1 · 统一网格</option><option value="B">方案 2 · 大内容浏览</option><option value="C">方案 3 · 空间分布</option></select><button id="next" aria-label="下一个原型方案">→</button></nav>
<script>
const entries=[
{id:'draft',app:'Word',title:'采购合同 · 初稿',type:'doc',content:'<h2>采购合同</h2><p>甲方：示例采购方<br>乙方：示例供应方</p><h3>第一条　交付范围</h3><p>本合同约定设备采购、交付验收与维护事项。</p><h3>第二条　付款安排</h3><p>验收完成后支付合同总额的 70%。</p>',hint:'进入前的前台窗口'},
{id:'revision',app:'Word',title:'采购合同 · 修订稿',type:'doc',content:'<h2>采购合同 · 修订</h2><p>甲方：示例采购方<br>乙方：示例供应方</p><h3>第二条　付款安排</h3><p><span class="revision">验收完成后支付合同总额的 70%。</span></p><p><span class="highlight">分两阶段验收，每阶段完成后支付对应款项。</span></p>',hint:'原桌面被遮挡'},
{id:'quote',app:'Excel',title:'供应商报价 · 对照表',type:'sheet',content:'<table><tr><th>项目</th><th>供应商甲</th><th>供应商乙</th></tr><tr><td>设备费用</td><td>48,000</td><td>45,500</td></tr><tr class="hot"><td>安装费用</td><td>2,500</td><td>3,800</td></tr><tr><td>维保年限</td><td>3 年</td><td>2 年</td></tr><tr><td>交付时间</td><td>30 天</td><td>45 天</td></tr></table>',hint:'原桌面右上方'},
{id:'reference',app:'Edge',title:'交付验收标准 · 参考资料',type:'browser',content:'<div class="url">示例资料 / 采购 / 验收规范</div><h2>交付验收标准</h2><p>设备到货后，应核对型号、数量及相关证明文件。双方共同完成安装与运行验收。</p><div class="article-lines"></div>',hint:'原桌面被遮挡'},
{id:'chat',app:'飞书',title:'采购协作 · 项目讨论',type:'chat',content:'<div>新版合同里已经更新付款节点，方便一起核对吗？</div><div>报价表也需要对照，安装费用有差异。</div><div>我打开这三份资料一起看。</div>',hint:'原桌面可见'},
{id:'notes',app:'记事本',title:'待核对事项 · 付款与维保',type:'code',content:'待核对事项\n\n1. 付款节点是否匹配验收阶段\n2. 安装费是否计入总报价\n3. 维保起算时间\n4. 交付延期的责任约定',hint:'原桌面被遮挡'},
{id:'files',app:'资源管理器',title:'采购资料 · 附件',type:'files',content:'<div>合同初稿.docx</div><div>合同修订稿.docx</div><div>供应商报价.xlsx</div><div>验收规范.pdf</div>',hint:'原桌面可见'},
{id:'protected',app:'文档阅读器',title:'供应商资质 · 内容预览不可用',type:'unavailable',content:'<strong>内容预览不可用</strong><span>仍可按应用名和标题选择</span>',hint:'窗口仍可选择'}
];
const variants=['A','B','C'], descriptions={A:'同样大小的卡片，统一浏览',B:'放大内容，逐份辨认',C:'位置线索示意，卡片互不遮挡'};
let selected=['draft'], invalid=new Set(), active=true, geometry='原布局', undo=null, applied=0;
let variant=variants.includes(new URL(location.href).searchParams.get('variant'))?new URL(location.href).searchParams.get('variant'):'A';
const byId=id=>document.getElementById(id), title=id=>entries.find(e=>e.id===id).title;
function setVariant(value){variant=value;byId('variant').value=value;document.body.dataset.variant=value;const url=new URL(location.href);url.searchParams.set('variant',value);history.replaceState(null,'',url);render();}
function toggle(id){if(!active)return;if(invalid.has(id)&&!selected.includes(id))return;selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];render();}
function render(){
 const focus=document.activeElement?.dataset.id;const filter=byId('find').value.toLowerCase();
 byId('variant-description').textContent=descriptions[variant];byId('candidate-count').textContent=`本屏 ${entries.length} 扇窗口`;
 byId('windows').innerHTML=entries.filter(e=>(e.title+' '+e.app).toLowerCase().includes(filter)).map(e=>{const order=selected.indexOf(e.id)+1,failed=invalid.has(e.id);return `<button class="window ${failed?'invalid':''}" data-id="${e.id}" ${failed&&!order?'disabled':''} aria-label="${e.title}" aria-pressed="${order>0}"><span class="check">${order||'+'}</span><span class="content-preview"><span class="win-chrome"><b>${e.app}</b><span>文件</span><span>查看</span></span><span style="display:${e.type==='unavailable'?'grid':e.type==='chat'?'flex':'block'}" class="${e.type}">${e.type==='doc'?'<span class="page" style="display:block">'+e.content+'</span>':e.content}</span></span><span class="window-title"><strong>${e.title}</strong><small>${e.app} · ${failed?'窗口已关闭，请取消该成员':e.hint}</small></span></button>`}).join('');
 byId('windows').querySelectorAll('button').forEach(button=>button.onclick=()=>toggle(button.dataset.id));
 if(focus)byId('windows').querySelector(`[data-id="${focus}"]`)?.focus({preventScroll:true});
 byId('empty').hidden=byId('windows').children.length>0;byId('selection-count').textContent=`已选 ${selected.length} 扇`;
 byId('selected').innerHTML=selected.map((id,index)=>`<div class="selected-item"><b>${index+1}</b><span>${title(id)}${invalid.has(id)?' · 已失效':''}</span><button data-remove="${id}" aria-label="取消选择 ${title(id)}">×</button></div>`).join('')||'<p>选择至少两扇窗口。</p>';
 byId('selected').querySelectorAll('button').forEach(button=>button.onclick=()=>toggle(button.dataset.remove));
 const kind=byId('layout').value;byId('layout-preview').className='layout-preview '+(kind==='grid'||kind==='auto'&&selected.length>=4?'grid':kind==='main'?'main':'');
 byId('layout-preview').innerHTML=selected.map((_,i)=>`<div>${i+1}</div>`).join('');
 const failed=selected.some(id=>invalid.has(id));byId('apply').disabled=!active||selected.length<2||failed;
 byId('status').textContent=failed?'已选窗口失效，请取消该成员后再排布。':selected.length<2?'再选一扇窗口即可排布。':'Enter 排布，Esc 取消。选择不会改变原布局。';
 byId('undo').disabled=!undo;byId('invalidate').disabled=selected.length<2;
 byId('state').textContent=`几何：${geometry} / 恢复记录：${undo??'无'} / 模拟排布次数：${applied}`;
}
function finish(confirm){if(!active||confirm&&byId('apply').disabled)return;
 if(confirm){undo=geometry;geometry=`模拟布局 ${++applied}`;}
 active=false;byId('overview').hidden=true;byId('overview').style.display='none';byId('closed').hidden=false;
 byId('closed-title').textContent=confirm?'已模拟排布':'已取消本次选择';
 byId('closed-message').textContent=confirm?`按所选顺序排布：${selected.map(title).join('、')}。`:'原来的模拟布局与恢复记录保持不变。';
 byId('closed-state').textContent=`当前几何：${geometry}；恢复记录：${undo??'无'}。此页未操作真实窗口。`;byId('reenter').focus();
}
function enter(){active=true;selected=['draft'];invalid.clear();byId('find').value='';byId('overview').hidden=false;byId('overview').style.display='';byId('closed').hidden=true;render();}
byId('find').oninput=render;byId('layout').onchange=render;byId('apply').onclick=()=>finish(true);byId('cancel').onclick=()=>finish(false);byId('restart').onclick=enter;byId('reenter').onclick=enter;
byId('invalidate').onclick=()=>{if(selected.length>=2){invalid.add(selected[1]);render();}};
byId('undo').onclick=()=>{if(undo){geometry=undo;undo=null;render();}};
byId('variant').onchange=event=>setVariant(event.target.value);
function cycle(delta){setVariant(variants[(variants.indexOf(variant)+delta+variants.length)%variants.length]);}
byId('previous').onclick=()=>cycle(-1);byId('next').onclick=()=>cycle(1);
document.addEventListener('keydown',event=>{
 const tag=event.target.tagName;
 if(event.altKey&&['1','2','3'].includes(event.key)&&active){event.preventDefault();byId('layout').value=['columns','main','grid'][Number(event.key)-1];render();return;}
 if(event.key==='Escape'&&active){event.preventDefault();finish(false);return;}
 if(['INPUT','TEXTAREA','SELECT'].includes(tag)||event.target.isContentEditable)return;
 if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1);return;}
 if(event.key==='Enter'&&active&&!event.ctrlKey&&!event.altKey&&!event.shiftKey&&!event.metaKey){
  if(event.target.closest('.switcher')||event.target.closest('.scenario')||event.target.id==='restart'||event.target.id==='cancel')return;
  event.preventDefault();finish(true);
 }
});
setVariant(variant);
</script>
</body>
</html>
